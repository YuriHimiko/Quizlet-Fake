<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script>
      // 1. Register global capture-phase error handlers FIRST to intercept and consume all cross-origin, Live2D, or storage-level errors
      (function() {
        var isSuppressedError = function(message, source, lineno, colno, error) {
          var msg = String(message || '').toLowerCase();
          var src = String(source || '').toLowerCase();
          
          // 1. Explicit generic "Script error." (always third-party CORS-masked error)
          if (msg === 'script error' || msg === 'script error.' || msg.includes('script error')) {
            return true;
          }
          
          // 2. Resources or files from third-party domains (unpkg, jsdelivr, live2d, etc.)
          if (src) {
            var currentOrigin = window.location.origin;
            if (!src.includes(currentOrigin)) {
              return true; // Suppress any external third-party script source
            }
          } else if (!source) {
            return true; // Suppress anonymous/unidentified source errors
          }

          // 3. Known error keyword signatures that we want to suppress gracefully
          if (
            msg.includes('cors') ||
            msg.includes('origin') ||
            msg.includes('cross-origin') ||
            msg.includes('live2d') ||
            msg.includes('webgl') ||
            msg.includes('context') ||
            msg.includes('canvas') ||
            msg.includes('clear') ||
            msg.includes('loading') ||
            src.includes('jsdelivr') ||
            src.includes('unpkg') ||
            src.includes('live2d')
          ) {
            return true;
          }

          return false;
        };

        // Suppress and lock onerror property to protect from being overwritten or bypassed
        var currentOnError = null;
        try {
          Object.defineProperty(window, 'onerror', {
            get: function() {
              return currentOnError;
            },
            set: function(val) {
              currentOnError = function(message, source, lineno, colno, error) {
                if (isSuppressedError(message, source, lineno, colno, error)) {
                  console.warn('Locked window.onerror suppressed third-party error:', message);
                  return true;
                }
                if (typeof val === 'function') {
                  try {
                    return val.apply(this, arguments);
                  } catch (e) {
                    console.warn('Error inside wrapped error listener:', e);
                    return true;
                  }
                }
                return false;
              };
            },
            configurable: true,
            enumerable: true
          });
        } catch (lockErr) {
          console.warn('Could not lock window.onerror:', lockErr);
          window.onerror = function(message, source, lineno, colno, error) {
            if (isSuppressedError(message, source, lineno, colno, error)) {
              return true;
            }
            return false;
          };
        }

        // Install fallback active handler immediately
        window.onerror = function(message, source, lineno, colno, error) {
          return isSuppressedError(message, source, lineno, colno, error);
        };

        // Wrap addEventListener on window and EventTarget to catch and swallow third-party script errors fully
        var wrapListener = function(origFunc) {
          if (!origFunc) return;
          return function(type, listener, options) {
            if ((type === 'error' || type === 'unhandledrejection') && typeof listener === 'function') {
              var wrapped = function(e) {
                if (type === 'error') {
                  if (e && isSuppressedError(e.message, e.filename, e.lineno, e.colno, e.error)) {
                    console.warn('Prevented third-party listener from receiving suppressed CORS/script error:', e.message);
                    try {
                      if (e.preventDefault) e.preventDefault();
                      if (e.stopPropagation) e.stopPropagation();
                      if (e.stopImmediatePropagation) e.stopImmediatePropagation();
                    } catch (err) {}
                    return;
                  }
                } else if (type === 'unhandledrejection') {
                  var reasonStr = String(e && e.reason || '').toLowerCase();
                  var reasonMsg = e && e.reason && e.reason.message ? String(e.reason.message).toLowerCase() : '';
                  if (
                    reasonStr.includes('script error') ||
                    reasonStr.includes('unpkg') ||
                    reasonStr.includes('jsdelivr') ||
                    reasonStr.includes('cors') ||
                    reasonStr.includes('origin') ||
                    reasonStr.includes('live2d') ||
                    reasonStr.includes('webgl') ||
                    reasonMsg.includes('script error') ||
                    reasonMsg.includes('cors') ||
                    reasonMsg.includes('live2d') ||
                    reasonMsg.includes('webgl')
                  ) {
                    console.warn('Prevented third-party listener from receiving suppressed rejection:', e.reason);
                    try {
                      if (e.preventDefault) e.preventDefault();
                      if (e.stopPropagation) e.stopPropagation();
                      if (e.stopImmediatePropagation) e.stopImmediatePropagation();
                    } catch (err) {}
                    return;
                  }
                }
                return listener.apply(this, arguments);
              };
              return origFunc.call(this, type, wrapped, options);
            }
            return origFunc.apply(this, arguments);
          };
        };

        try {
          window.addEventListener = wrapListener(window.addEventListener);
          if (window.EventTarget && window.EventTarget.prototype) {
            window.EventTarget.prototype.addEventListener = wrapListener(window.EventTarget.prototype.addEventListener);
          }
        } catch (wrapErr) {
          console.warn('Could not wrap addEventListener listeners:', wrapErr);
        }
      })();

      // 2. Immediately polyfill localStorage and sessionStorage BEFORE anything else can fail or be loaded
      (function() {
        var createInMemoryStorage = function() {
          var store = {};
          return {
            getItem: function(key) {
              return store[key] !== undefined ? store[key] : null;
            },
            setItem: function(key, value) {
              store[key] = String(value);
            },
            removeItem: function(key) {
              delete store[key];
            },
            clear: function() {
              store = {};
            },
            key: function(index) {
              var keys = Object.keys(store);
              return keys[index] !== undefined ? keys[index] : null;
            },
            get length() {
              return Object.keys(store).length;
            }
          };
        };

        var polyfillStorage = function(type) {
          var isSupported = false;
          try {
            var storage = window[type];
            if (storage) {
              var testKey = '__storage_test__';
              storage.setItem(testKey, testKey);
              storage.removeItem(testKey);
              isSupported = true;
            }
          } catch (e) {
            isSupported = false;
          }

          if (!isSupported) {
            console.warn(type + ' is blocked or unavailable; polyfilling.');
            var mockStorage = createInMemoryStorage();
            
            // Try defining on Window.prototype first
            try {
              Object.defineProperty(Window.prototype, type, {
                get: function() { return mockStorage; },
                configurable: true,
                enumerable: true
              });
            } catch (prototypeError) {
              console.warn('Failed to define ' + type + ' on Window.prototype:', prototypeError);
              
              // Fallback: try defining directly on window
              try {
                Object.defineProperty(window, type, {
                  value: mockStorage,
                  configurable: true,
                  enumerable: true,
                  writable: true
                });
              } catch (windowError) {
                console.error('Failed to define ' + type + ' on window:', windowError);
              }
            }
          }
        };

        polyfillStorage('localStorage');
        polyfillStorage('sessionStorage');
      })();

      // 3. Automatically enable CORS for all images to prevent WebGL context tainting
      (function() {
        var origImage = window.Image;
        if (origImage) {
          var ImageWrapper = function(width, height) {
            var img = new origImage(width, height);
            img.crossOrigin = 'anonymous';
            return img;
          };
          ImageWrapper.prototype = origImage.prototype;
          window.Image = ImageWrapper;
        }

        var origCreateElement = document.createElement;
        if (origCreateElement) {
          document.createElement = function(tagName, options) {
            var elem = origCreateElement.call(document, tagName, options);
            if (elem && tagName && String(tagName).toLowerCase() === 'img') {
              try {
                elem.crossOrigin = 'anonymous';
              } catch (e) {}
            }
            return elem;
          };
        }
      })();

      // 4. Safely wrap WebGL contexts and requestAnimationFrame to catch-and-suppress Live2D/canvas/WebGL errors
      (function() {
        var origRAF = window.requestAnimationFrame || window.webkitRequestAnimationFrame || window.mozRequestAnimationFrame;
        if (origRAF) {
          var safeRAF = function(callback) {
            return origRAF(function(timestamp) {
              try {
                callback(timestamp);
              } catch (e) {
                var errStr = String(e && e.message || e).toLowerCase();
                if (errStr.includes('live2d') || errStr.includes('webgl') || errStr.includes('context') || errStr.includes('clear') || errStr.includes('canvas')) {
                  console.warn('Safely intercepted and suppressed Live2D animation frame error:', e);
                } else {
                  console.warn('Safely suppressed third-party callback script error:', e);
                }
              }
            });
          };
          window.requestAnimationFrame = safeRAF;
          if (window.webkitRequestAnimationFrame) window.webkitRequestAnimationFrame = safeRAF;
          if (window.mozRequestAnimationFrame) window.mozRequestAnimationFrame = safeRAF;
        }

        var origGetContext = HTMLCanvasElement.prototype.getContext;
        if (origGetContext) {
          HTMLCanvasElement.prototype.getContext = function(type, attributes) {
            var ctx = origGetContext.apply(this, arguments);
            if (ctx && (type === 'webgl' || type === 'experimental-webgl')) {
              var canvasEl = this;
              return new Proxy(ctx, {
                get: function(target, prop) {
                  if (!canvasEl.isConnected) {
                    if (typeof target[prop] === 'function') {
                      return function() { return null; };
                    }
                    return undefined;
                  }
                  
                  var value = target[prop];
                  if (typeof value === 'function') {
                    return function() {
                      try {
                        return value.apply(target, arguments);
                      } catch (webglErr) {
                        console.warn('Safely intercepted and suppressed WebGL method call exception:', webglErr);
                        return null;
                      }
                    };
                  }
                  return value;
                }
              });
            }
            return ctx;
          };
        }
      })();

      // 5. Robustly wrap XMLHttpRequest to catch and bypass network/CORS errors on third-party domains
      (function() {
        var origOpen = XMLHttpRequest.prototype.open;
        var origSend = XMLHttpRequest.prototype.send;
        if (origOpen && origSend) {
          XMLHttpRequest.prototype.open = function(method, url) {
            this._url = url;
            return origOpen.apply(this, arguments);
          };
          XMLHttpRequest.prototype.send = function() {
            var self = this;
            try {
              return origSend.apply(this, arguments);
            } catch (xhrErr) {
              console.warn('Safely caught sync XHR send exception to bypass crash:', self._url, xhrErr);
              if (typeof self.onerror === 'function') {
                try {
                  self.onerror(new Error('Suppressed network failure'));
                } catch (innerErr) {}
              }
            }
          };
        }
      })();

      // 6. Dynamically load Live2D widget script with explicit error suppression at the element level
      (function() {
        var script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/gh/stevenjoezhang/live2d-widget/live2d.min.js';
        script.crossOrigin = 'anonymous';
        script.onload = function() {
          console.log('Live2D script loaded successfully via dynamic loader.');
        };
        script.onerror = function(e) {
          console.warn('Suppressed Live2D CDN script dynamic loading error safely:', e);
          if (e) {
            try {
              if (e.preventDefault) e.preventDefault();
              if (e.stopPropagation) e.stopPropagation();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            } catch (pErr) {}
          }
          // Mock windows.loadlive2d to degrade gracefully instead of crashing other scripts
          window.loadlive2d = function() {
            console.warn('loadlive2d safely skipped (CDN script failed to load).');
          };
        };
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
